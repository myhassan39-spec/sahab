name: Build APK
on:
  push:
    paths: ['Sahab.zip']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q Sahab.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug --no-daemon
        working-directory: Sahab
      - uses: actions/upload-artifact@v4
        with:
          name: Sahab-debug-apk
          path: Sahab/app/build/outputs/apk/debug/app-debug.apk
